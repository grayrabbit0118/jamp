<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ジャンプゲーム</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-shell">
        <h1>ジャンプゲーム</h1>
        <button id="startButton">ゲーム開始</button>

        <div class="game-area" id="gameArea">
            <div class="sky"></div>
            <div class="cloud cloud-one"></div>
            <div class="cloud cloud-two"></div>
            <div class="ground"></div>
            <div class="obstacle obstacle-a"></div>
            <div class="obstacle obstacle-b"></div>
            <div class="obstacle obstacle-c"></div>
            <div class="obstacle obstacle-d"></div>
            <div class="obstacle obstacle-e"></div>
            <div class="obstacle obstacle-f"></div>
            <div class="obstacle obstacle-g"></div>
            <div class="obstacle obstacle-h"></div>
            <div class="obstacle obstacle-i"></div>
            <div class="obstacle obstacle-j"></div>
            <div class="obstacle obstacle-k"></div>
            <div class="obstacle obstacle-l"></div>
            <div class="obstacle obstacle-m"></div>
            <div class="obstacle obstacle-n"></div>
            <div class="obstacle obstacle-o"></div>
            <div class="obstacle obstacle-p"></div>
            <div class="obstacle obstacle-q"></div>
            <div class="obstacle obstacle-r"></div>
            <div class="obstacle obstacle-s"></div>
            <div class="obstacle obstacle-t"></div>
            <div class="star" id="star"></div>
            <div class="score" id="score">Score: 0/15</div>
            <div class="stage-label" id="stageLabel">STAGE 1</div>
            <div class="character" id="character">🏃</div>
            <div class="countdown" id="countdown">3</div>
            <div class="instruction-overlay" id="instructionOverlay">
                <div class="instruction-content">
                    <div class="instruction-title">遊び方</div>
                    <div class="instruction-controls">
                        <p>小ジャンプ ⇒ 1タップ</p>
                        <p>大ジャンプ ⇒ 2タップ</p>
                    </div>
                    <div class="instruction-stage-message" id="instructionStageMessage">障害物をジャンプして避けろ</div>
                    <button id="instructionContinueButton" type="button">遊ぶ</button>
                </div>
            </div>
            <div class="stage-transition" id="stageTransition">
                <div class="stage-transition-content">
                    <div id="stageTransitionMessage">STAGE 2</div>
                    <div id="stageTransitionDetail"></div>
                </div>
            </div>
            <div class="game-over" id="gameOver">
                <div class="game-over-content">
                    <div id="gameOverMessage">GAME OVER</div>
                    <div class="game-over-actions">
                        <button id="retryButton" type="button">リトライ</button>
                    </div>
                </div>
            </div>
            <div class="goal" id="goal">
                <div class="goal-flag">🏁</div>
                <div class="goal-label">GOAL</div>
            </div>
            <button class="jump-button" id="jumpButton" type="button">Jump</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
